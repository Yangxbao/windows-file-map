<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本机文件地图与一键清理助手</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --line:#e4e9f0; --txt:#1f2937; --sub:#6b7280;
  --brand:#2563eb; --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px 0;position:sticky;top:0;z-index:50}
.brand{font-size:18px;font-weight:700}
.brand small{color:var(--sub);font-weight:400;margin-left:8px}
.meta-line{color:var(--sub);font-size:12px;margin-top:2px}
nav{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
nav button{border:none;background:none;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--sub);
  border-bottom:2px solid transparent}
nav button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
main{max-width:1320px;margin:14px auto;padding:0 14px}
footer{max-width:1320px;margin:20px auto;padding:10px 14px;color:var(--sub);font-size:12px;line-height:1.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .v{font-size:21px;font-weight:700;color:var(--brand)}
.stat .k{color:var(--sub);font-size:12px;margin-top:2px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:600;white-space:nowrap}
code,.mono{font-family:Consolas,"Courier New",monospace;font-size:12px;word-break:break-all}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;color:#fff;margin-right:4px;white-space:nowrap}
.b-gray{background:#94a3b8}.b-blue{background:#3b82f6}.b-green{background:#22c55e}
.b-red{background:#ef4444}.b-orange{background:#f97316}.b-purple{background:#a855f7}
.b-cyan{background:#06b6d4}.b-yellow{background:#eab308}
.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;
  color:#1e40af;font-size:13px;margin-bottom:14px;line-height:1.7}
.warnbox{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;color:#92400e;
  font-size:13px;margin-bottom:14px;line-height:1.7}
.livebox{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:8px;padding:10px 12px;color:#065f46;
  font-size:13px;margin-bottom:14px;line-height:1.7}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toolbar select,.toolbar input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.toolbar input{width:380px}
.hint{color:var(--sub);font-size:12px}
.tree-wrap{display:flex;gap:12px;align-items:flex-start}
.tree{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.detail{width:430px;flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}
.detail .path{background:#f1f5f9;border-radius:6px;padding:6px 8px;font-family:Consolas,monospace;
  font-size:12px;word-break:break-all;margin:6px 0;user-select:all;cursor:text}
.row{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:pointer;line-height:1.5}
.row:hover{background:#eef2ff}
.row.sel{background:#dbeafe}
.row .tg{width:16px;flex-shrink:0;text-align:center;color:var(--sub);font-size:11px;cursor:pointer}
.row .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
.row .zh{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row .sz{color:var(--sub);font-size:12px;white-space:nowrap}
.row .badge{margin-right:0}
.kids{margin-left:20px;border-left:1px dashed var(--line);padding-left:4px}
.more{color:var(--brand);cursor:pointer;font-size:12px;padding:4px 6px}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:5px 12px;cursor:pointer;font-size:13px;text-decoration:none;color:var(--txt)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.mini{padding:2px 8px;font-size:12px;border-radius:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 12px;cursor:pointer;font-size:12px}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pcard .t{font-weight:700;font-size:14px;margin-bottom:4px}
.pcard .kv{font-size:12px;color:var(--sub);margin:2px 0;line-height:1.6}
.pcard .kv b{color:var(--txt);font-weight:600}
.bar{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--brand)}
.mark{background:#fef08a;border-radius:2px}
.muted{color:var(--sub);font-size:12px}
.sec{margin-bottom:8px}
details summary{cursor:pointer;color:var(--brand);font-size:12px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2937;color:#fff;
  padding:8px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:98}
#modal .box{background:#fff;border-radius:12px;padding:20px;max-width:540px;width:92%}
#modal h3{margin-top:0}
.flash{animation:fl 1.6s ease}
@keyframes fl{0%{background:#fde68a}100%{background:transparent}}
/* ---- 一键清理页 ---- */
.banner{border-radius:10px;padding:14px 16px;margin-bottom:14px;border:1px solid;line-height:1.7}
.banner.ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46}
.banner.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.banner.err{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.banner h2{margin:0 0 4px;font-size:16px}
.banner .big{font-size:23px;font-weight:700;letter-spacing:.3px}
.banner .row2{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.banner .acts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.pbar{height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:8px 0 6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22c55e);transition:width .35s}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.catcard{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;transition:opacity .2s}
.catcard.off{opacity:.5;background:#f8fafc}
.catcard label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.catcard .nm{font-weight:600;font-size:13px}
.catcard .p{color:var(--sub);font-size:11px;word-break:break-all;line-height:1.5;margin-top:2px}
.catcard .im{color:#92400e;background:#fffbeb;border-radius:6px;padding:4px 7px;font-size:11px;margin-top:6px;line-height:1.5}
.catcard .sz{color:var(--brand);font-weight:700}
.catcard .none{color:#94a3b8}
.pager{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:0 6px;border-radius:6px;background:rgba(0,0,0,.06);font-size:11px;margin-left:6px;font-weight:400}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.kpi span{background:#f1f5f9;border-radius:8px;padding:4px 10px;font-size:12px}
@media (max-width:980px){.tree-wrap{flex-direction:column}.detail{width:100%;position:static}}
</style>
</head>
<body>
<header>
  <div class="brand">🗂️ 本机文件地图与一键清理助手 <small>只读盘点 + 白名单安全清理 · 未确认绝不删除</small></div>
  <div class="meta-line" id="metaLine"></div>
  <nav id="tabs">
    <button data-page="overview" class="on">📊 电脑总览</button>
    <button data-page="clean">🧹 一键清理</button>
    <button data-page="tree">🌳 目录树</button>
    <button data-page="projects">🧩 项目地图</button>
    <button data-page="search">🔍 全局搜索</button>
    <button data-page="risk">⚠️ 空间与风险</button>
  </nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script src="server-mode.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const main = $("#main");
let SUMMARY = null;   // /api/summary 结果

const CATS = {
  sys:["系统目录","#64748b"], user:["个人目录","#2563eb"], devtool:["开发环境","#7c3aed"],
  project:["开发项目","#16a34a"], deps:["依赖目录","#d97706"], build:["构建产物","#ea580c"],
  git:["Git 版本库","#0f766e"], docs:["文档资料","#0369a1"], code:["代码","#4f46e5"],
  media:["图片","#db2777"], video:["视频","#be185d"], audio:["音频","#a21caf"],
  archive:["压缩包","#b45309"], exe:["程序/安装包","#dc2626"], data:["数据文件","#0891b2"],
  cfg:["配置文件","#6d28d9"], sensitive:["疑似敏感","#e11d48"], cache:["缓存","#94a3b8"],
  unknown:["用途待确认","#f59e0b"], other:["其他","#6b7280"]
};
const SCANNED = {0:"未扫描",1:"完成",2:"部分扫描",3:"枚举失败",4:"规则排除",5:"已不存在"};
const SCANNED_CLS = {0:"b-gray",1:"b-green",2:"b-yellow",3:"b-red",4:"b-gray",5:"b-gray"};
const ERR_LABELS = {denied:"拒绝访问",missing:"对象丢失",locked:"被占用",longpath:"路径超长",
                    readlink:"链接目标读取失败",ioerror:"IO 错误",excluded:"规则排除"};
const ATTR_BITS = [[1,"只读"],[2,"隐藏"],[4,"系统"],[0x20,"存档"],[0x400,"链接"]];

function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fmtSize(n){
  if(n==null||n===undefined) return "未统计";
  if(n<1024) return n+" B";
  const u=["KB","MB","GB","TB"];let v=n/1024,i=0;
  while(v>=1024&&i<u.length-1){v/=1024;i++;}
  return v.toFixed(1)+" "+u[i];
}
function fmtTime(m){
  if(!m) return "—";
  const d=new Date(m*1000),p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function fmtInt(n){return (n??0).toLocaleString("zh-CN");}
function catBadge(c){
  const cat=CATS[c]||["其他","#6b7280"];
  return '<span class="badge" style="background:'+cat[1]+'">'+esc(cat[0])+"</span>";
}
function flagBadges(f,scanned){
  let h="";
  if(scanned!==undefined && scanned!==1 && !(f&64))
    h+='<span class="badge '+ (SCANNED_CLS[scanned]||"b-gray") +'">'+ (SCANNED[scanned]||scanned) +"</span>";
  if(f&128)h+='<span class="badge b-green">项目</span>';
  if(f&4)h+='<span class="badge b-red">疑似敏感</span>';
  if(f&1)h+='<span class="badge b-red">拒绝访问</span>';
  if(f&32)h+='<span class="badge b-yellow">大小不完整</span>';
  if(f&2)h+='<span class="badge b-purple">链接</span>';
  if(f&64)h+='<span class="badge b-gray">规则排除</span>';
  return h;
}
function attrsText(a){
  if(a==null) return "—";
  return ATTR_BITS.filter(b=>a&b[0]).map(b=>b[1]).join("、")||"普通";
}
function toast(t){
  const el=$("#toast");el.textContent=t;el.style.opacity=1;
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.opacity=0,2200);
}
async function api(path, opts){
  const r=await fetch(path, opts||{});
  const j=await r.json();
  if(j && j.ok===false) throw new Error(j.error||("HTTP "+r.status));
  return j;
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true;}
  catch(e){
    try{
      const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();
      const ok=document.execCommand("copy");ta.remove();return ok;
    }catch(e2){return false;}
  }
}
function showModal(html){$("#modalBox").innerHTML=html+'<div style="text-align:right;margin-top:14px"><button class="btn primary" onclick="closeModal()">我知道了</button></div>';$("#modal").style.display="flex";}
function closeModal(){$("#modal").style.display="none";}
function openFolder(path){
  if(window.HAS_HELPER){
    fetch("/api/open?path="+encodeURIComponent(path))
      .then(r=>r.json()).then(j=>{
        if(j.ok) toast("已在 Windows 资源管理器中打开");
        else toast("打开失败："+(j.error||"未知错误"));
      }).catch(()=>fallbackOpen(path));
  }else fallbackOpen(path);
}
function fallbackOpen(path){
  copyText(path).then(ok=>{
    showModal('<h3>📂 打开所在文件夹</h3>'+
      '<p>请通过 <b>启动文件地图.bat</b> 启动本地服务后使用此按钮（网页直开模式下浏览器安全限制不允许调起资源管理器）。</p>'+
      '<p>已复制路径'+(ok?"成功":"（请手动选择复制）")+'：</p>'+
      '<p class="mono" style="background:#f1f5f9;padding:8px;border-radius:6px;word-break:break-all">'+esc(path)+'</p>'+
      '<p>也可以打开「此电脑」，把路径粘贴到顶部地址栏后回车。</p>');
  });
}
function fileLink(path){
  if(!path) return "";
  return "file:///"+encodeURI(path.replace(/\\/g,"/")).replace(/#/g,"%23").replace(/\?/g,"%3F");
}
function hlEsc(text,term){
  let h=esc(text);
  if(!term)return h;
  const lt=esc(term).toLowerCase(),lh=h.toLowerCase();
  let out="",i=0,idx;
  while((idx=lh.indexOf(lt,i))>=0){
    out+=h.slice(i,idx)+"<span class='mark'>"+h.slice(idx,idx+lt.length)+"</span>";i=idx+lt.length;
  }
  return out+h.slice(i);
}

/* ==================== 框架 ==================== */
let curPage="overview";
function initTabs(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");curPage=b.dataset.page;render();
    });
  });
}
function render(){
  if(curPage==="overview")pageOverview();
  else if(curPage==="clean")pageClean();
  else if(curPage==="tree")pageTree();
  else if(curPage==="projects")pageProjects();
  else if(curPage==="search")pageSearch();
  else if(curPage==="risk")pageRisk();
  window.scrollTo(0,0);
}

/* ==================== 页面一：电脑总览 ==================== */
function pageOverview(){
  const st=SUMMARY.stats||{},dr=SUMMARY.drives||[];
  const main_=`
  <div id="liveBox"></div>
  <div class="notice">📖 本地图由<b>全量只读递归扫描</b>生成：所有本地固定磁盘逐级枚举到最深一层，
   没有条目数/深度上限；只有回收站、卷影副本和确实无法访问的位置被排除并逐条记录原因。
   系统目录、软件目录、node_modules 等均保留完整树与清单（只读元数据，不读取文件内容）。</div>
  <div class="cards">
    <div class="stat"><div class="v">${fmtInt(st.rows)}</div><div class="k">数据库记录总条目</div></div>
    <div class="stat"><div class="v">${fmtInt(st.dirs)}</div><div class="k">文件夹（含磁盘根）</div></div>
    <div class="stat"><div class="v">${fmtInt(st.files)}</div><div class="k">文件</div></div>
    <div class="stat"><div class="v">${fmtSize(st.bytes)}</div><div class="k">实测数据量合计</div></div>
    <div class="stat"><div class="v">${fmtInt(st.projects)}</div><div class="k">识别出的项目</div></div>
    <div class="stat"><div class="v">${fmtInt(st.pending)}</div><div class="k">待识别代码目录</div></div>
  </div>
  <div class="card"><h2>✅ 扫描完成度（三层区分）</h2>
    <table>
      <tr><th>层级</th><th>结果</th></tr>
      <tr><td>① 目录枚举</td><td>完成 <b>${fmtInt(st.dirs_done)}</b> 个目录；失败 <b class="mono">${fmtInt(st.dirs_fail)}</b>；规则排除 <b>${fmtInt(st.dirs_excl)}</b>；中断 ${fmtInt(st.dirs_part)}；已消失 ${fmtInt(st.dirs_gone)}</td></tr>
      <tr><td>② 文件元数据</td><td>成功读取 <b>${fmtInt(st.files_meta_ok)}</b> 个文件的大小/时间/属性；失败 <b class="mono">${fmtInt(st.files_meta_fail)}</b></td></tr>
      <tr><td>③ 用途分析</td><td>识别项目 <b>${fmtInt(st.projects)}</b> 个；待识别 <b>${fmtInt(st.pending)}</b> 个（只依据标识文件与结构，未运行任何代码）</td></tr>
    </table>
    <p class="muted">错误分类：${Object.entries(st.events_by_kind||{}).map(([k,v])=>(ERR_LABELS[k]||k)+" "+fmtInt(v)).join("　")||"无"}</p>
  </div>
  <div class="card"><h2>💾 磁盘与覆盖情况</h2>
    <table><tr><th>磁盘</th><th>类型</th><th>总容量</th><th>可用空间</th><th>实测数据量</th><th>目录</th><th>文件</th><th>状态</th></tr>
    ${dr.map(d=>{
      const used=(d.total!=null&&d.free!=null)?d.total-d.free:null;
      const pct=used&&d.total?Math.round(used/d.total*100):0;
      return `<tr><td><b>${d.letter}:</b></td><td>${esc(d.type)}</td>
        <td>${d.total!=null?fmtSize(d.total):"—"}<div class="bar"><i style="width:${pct}%"></i></div></td>
        <td>${d.free!=null?fmtSize(d.free):"—"}</td>
        <td>${fmtSize(d.bytes)}</td><td>${fmtInt(d.dirs)}</td><td>${fmtInt(d.files)}</td>
        <td>${d.scanned?'<span class="badge b-green">已全量枚举</span>':'<span class="badge b-gray">未扫描</span> '+esc(d.note||"")}</td></tr>`;
    }).join("")}</table>
  </div>
  <div class="card"><h2>📁 占用空间最大的目录 TOP12（实测汇总）</h2>
    <table><tr><th>大小</th><th>路径</th></tr>
    ${(SUMMARY.risk_top||[]).map(d=>`<tr><td style="white-space:nowrap"><b>${fmtSize(d.s)}</b>${d.est?'<span class="badge b-yellow">下限</span>':""}</td>
      <td class="mono">${esc(d.p)}</td></tr>`).join("")}</table>
  </div>
  <div class="card"><h2>🏷️ 一级目录类别分布（按实测大小）</h2>
    ${(SUMMARY.cat_sizes||[]).slice(0,10).map(c=>`<div style="display:flex;align-items:center;gap:8px;margin:4px 0">
      <div style="width:110px">${catBadge(c.c)}</div>
      <div style="flex:1"><div class="bar"><i style="width:${Math.max(2,Math.round(c.s/((SUMMARY.cat_sizes[0]||{s:1}).s||1)*100))}%"></i></div></div>
      <div style="width:90px;text-align:right" class="muted">${fmtSize(c.s)}</div></div>`).join("")}
  </div>
  <div class="card"><h2>📄 配套报告</h2>
    <ul>
      <li><a href="文件地图说明.md">文件地图说明.md</a> —— 使用说明</li>

function rowHtml(n){
  const isDir=!!n.is_dir;
  return '<span class="tg">'+(isDir?"▸":"·")+"</span>"+
    "<span>"+(isDir?"📁":"📄")+"</span>"+

async function loadChildren(path, container){
  container.innerHTML='<div class="muted" style="padding:4px 20px">加载中…</div>';
  try{
    const j=await api("/api/children?path="+encodeURIComponent(path)+"&offset=0&limit=200");
    container.innerHTML="";
    kidsCache.set(path, container);
    appendKids(j, container, path);
  }catch(e){
    container.innerHTML='<div class="muted">加载失败：'+esc(e.message)+"</div>";
  }
}
function appendKids(j, container, path){
  const frag=document.createDocumentFragment();
  for(const n of j.items){
    const row=document.createElement("div");
    row.className="row"+(selectedPath===n.path?" sel":"");
    row.dataset.path=n.path;
    row.innerHTML=rowHtml(n);
    row.addEventListener("click",e=>{
      if(e.target.classList.contains("tg")&&n.is_dir){toggleNode(n,row);return;}
      selectedPath=n.path;
      document.querySelectorAll(".row.sel").forEach(r=>r.classList.remove("sel"));
      row.classList.add("sel");
      showDetail(n.path);
    });
    frag.appendChild(row);
    if(n.is_dir&&expanded.has(n.path)){
      const kids=document.createElement("div");
      kids.className="kids";
      frag.appendChild(kids);
      loadChildren(n.path, kids);
    }
  }
  container.appendChild(frag);
  if(j.offset+j.limit < j.total){
    const more=document.createElement("div");
    more.className="more";
    more.textContent="显示更多（还有 "+fmtInt(j.total-j.offset-j.limit)+" 项…）";
    more.addEventListener("click",async e=>{
      e.stopPropagation();
      more.textContent="加载中…";
      try{
        const j2=await api("/api/children?path="+encodeURIComponent(path)+
          "&offset="+more._off+"&limit=200");
        more.remove();
        appendKids(j2, container, path);
      }catch(err){more.textContent="加载失败："+err.message;}
    });
    more._off=j.offset+j.limit;
    container.appendChild(more);
  }
}
function toggleNode(n, row){
  const p=n.path;
  const next=row.nextElementSibling;
  if(expanded.has(p)){
    expanded.delete(p);
    kidsCache.delete(p);
    if(next&&next.classList&&next.classList.contains("kids"))next.remove();
    row.querySelector(".tg").textContent="▸";
  }else{
    expanded.add(p);
    const kids=document.createElement("div");
    kids.className="kids";
    row.after(kids);
    row.querySelector(".tg").textContent="▾";
    loadChildren(p, kids);
  }
}

async function locateInTree(path){
  curPage="tree";
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.page==="tree"));

  let acc=parts[0]+"\\";
  selectedPath=path;
  pageTree();
  for(let i=1;i<parts.length;i++){
    acc=acc.replace(/\\+$/,"")+"\\"+parts[i];
    for(let t=0;t<20;t++){
      const row=Array.from(document.querySelectorAll(".row")).find(r=>r.dataset.path===acc);
      if(row){break;}
      await new Promise(r=>setTimeout(r,120));
    }
    const row=Array.from(document.querySelectorAll(".row")).find(r=>r.dataset.path===acc);
    if(row&&row.querySelector(".tg").textContent==="▸"){
      row.querySelector(".tg").click();
      await new Promise(r=>setTimeout(r,200));
    }
  }
  for(let t=0;t<20;t++){
    const row=Array.from(document.querySelectorAll(".row")).find(r=>r.dataset.path===path);
    if(row){row.scrollIntoView({block:"center"});row.classList.add("flash");break;}
    await new Promise(r=>setTimeout(r,120));
  }
}

let searchSeq=0;
function pageSearch(){

  const q=$("#q");
  let tm=null;
  q.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(doSearch,300);});
  q.addEventListener("keydown",e=>{if(e.key==="Enter")doSearch();});

async function doSearch(offset=0, keep=false){
  const raw=$("#q").value.trim();
  const res=$("#qRes"),hint=$("#qHint");
  if(!raw){res.innerHTML='<p class="muted">输入关键词开始搜索。</p>';hint.textContent="";return;}
  const seq=++searchSeq;
  const t0=performance.now();
  try{
    const j=await api("/api/search?q="+encodeURIComponent(raw)+"&offset="+offset);
    if(seq!==searchSeq)return;
    const ms=Math.round(performance.now()-t0);
    hint.textContent="共 "+fmtInt(j.total)+" 条匹配（"+ms+"ms）";
    if(!j.items.length&&!keep){res.innerHTML='<p class="muted">没有找到匹配的条目，试试更短的关键词。</p>';return;}
    const old=keep?res.querySelector("table"):null;
    const tbl=document.createElement("table");
    if(!keep){
      res.innerHTML="";
      tbl.innerHTML="<tr><th>名称</th><th>中文说明</th><th>类别</th><th>大小</th><th>路径</th><th>操作</th></tr>";
      res.appendChild(tbl);
    }
    const frag=document.createDocumentFragment();
    for(const n of j.items){
      const tr=document.createElement("tr");
      tr.innerHTML=`<td style="white-space:nowrap">${n.is_dir?"📁":"📄"} <b>${hlEsc(n.name,raw)}</b>${flagBadges(n.flags,n.scanned)}</td>
        <td>${hlEsc(n.zh||"",raw)}</td><td>${catBadge(n.cat)}</td>
        <td style="white-space:nowrap">${fmtSize(n.size)}</td>
        <td class="mono">${hlEsc(n.path,raw)}</td>
        <td style="white-space:nowrap">
          <button class="btn mini" data-copy="${esc(n.path)}">📋</button>
          <button class="btn mini" data-open="${esc(n.path)}">📂</button>
          ${n.is_dir?`<button class="btn mini" data-loc="${esc(n.path)}">🌳</button>`:""}
        </td>`;
      frag.appendChild(tr);
    }
    tbl.appendChild(frag);
    const oldMore=res.querySelector(".more");if(oldMore)oldMore.remove();
    if(j.offset+j.limit<j.total){
      const more=document.createElement("div");
      more.className="more";
      more.textContent="加载更多（还有 "+fmtInt(j.total-j.offset-j.limit)+" 条…）";
      more.addEventListener("click",()=>doSearch(j.offset+j.limit, true));
      res.appendChild(more);
    }
    res.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>copyText(b.dataset.copy).then(ok=>toast(ok?"路径已复制":"复制失败"))));
    res.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",()=>openFolder(b.dataset.open)));
    res.querySelectorAll("[data-loc]").forEach(b=>b.addEventListener("click",()=>locateInTree(b.dataset.loc)));
  }catch(e){hint.textContent="搜索失败："+e.message;}
}

/* ==================== 页面：一键清理 ==================== */
let CLEAN_CATS=null, CLEAN_SCAN=null, CLEAN_SEL=new Set(), cleanTimer=null, CLEAN_RUNNING=false;
let CLEAN_HIST={offset:0,total:0,limit:10}, CLEAN_LOG={run:0,status:"",offset:0};
const CLEAN_ST={done:["完成","b-green"],cancelled:["已取消","b-yellow"],error:["出错","b-red"],
                interrupted:["被中断","b-gray"],running:["进行中","b-blue"]};

function fmtDur(s){
  if(s==null||isNaN(s)) return "—";
  s=Math.round(s);
  if(s<60) return s+" 秒";
  return Math.floor(s/60)+" 分 "+(s%60)+" 秒";
}
function fmtDelta(n){
  if(n==null) return "";
  return (n>=0?"+":"−")+fmtSize(Math.abs(n));
}
function cleanSelLoad(C){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem("fm_clean_sel")||"null");}catch(e){saved=null;}
  const all=C.categories.map(c=>c.id);
  if(Array.isArray(saved)){
    CLEAN_SEL=new Set(saved.filter(x=>all.includes(x)));
    if(!CLEAN_SEL.size) CLEAN_SEL=new Set(C.categories.filter(c=>c.in_default).map(c=>c.id));
  }else{
    CLEAN_SEL=new Set(C.categories.filter(c=>c.in_default).map(c=>c.id));
  }
}
function cleanSelSave(){try{localStorage.setItem("fm_clean_sel",JSON.stringify([...CLEAN_SEL]));}catch(e){}}

async function pageClean(){
  main.innerHTML='<div class="muted">加载清理模块…</div>';
  let C;
  try{C=await api("/api/clean/categories");}
  catch(e){
    main.innerHTML='<div class="card"><h2>清理模块加载失败</h2><p>'+esc(e.message)+'</p>'
      +'<p class="muted">请确认本地服务正常运行（双击 启动文件地图.bat），然后刷新本页。</p></div>';
    return;
  }
  CLEAN_CATS=C; CLEAN_SCAN=null; cleanSelLoad(C);
  let h='<div id="cleanBanner"></div>';
  if(!C.policy_accepted){
    h+='<div class="card" id="policyCard"><h2>首次使用：请确认安全清理范围</h2>'
      +'<p>启用后，以后点击「一键清理」都会直接按以下范围执行，不再逐项询问：</p>'
      +'<table><tr><th>类别</th><th>位置</th><th>说明</th></tr>'
      +C.categories.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="mono">${esc(c.roots.join(" ； "))}</td><td class="muted">${esc(c.desc)}</td></tr>`).join("")+"</table>"
      +'<div class="warnbox" style="margin-top:10px"><b>永远不会清理：</b>'+C.never_clean.map(esc).join("；")+"</div>"
      +'<p style="margin-top:10px"><button class="btn primary" id="policyBtn">✅ 我已了解清理范围，启用安全清理</button>'
      +' <span class="muted">这是一次性确认，之后的一键操作都只执行以上白名单。</span></p></div>';
  }
  h+=`<div class="card">
    <h2>🧹 选择要清理的类别</h2>
    <p class="muted" style="margin:-4px 0 8px">规则全部内置在程序里，页面<b>只能勾选类别、不能指定任何路径</b>。
      被占用 / 只读 / 无法确认的对象一律跳过并记录原因；每个被删除的文件都写入日志。</p>
    <div class="pager" style="margin:0 0 10px">
      <button class="btn mini" id="selAll">全选</button>
      <button class="btn mini" id="selNone">全不选</button>
      <button class="btn mini" id="selDef">恢复推荐</button>
      <span class="hint" id="selHint"></span>
    </div>
    <div class="catgrid" id="catGrid"></div>
  </div>
  <div class="card">
    <h2>执行</h2>
    <p style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0">
      <button class="btn primary" id="oneBtn" style="font-size:16px;padding:10px 22px">🧹 一键清理所选类别</button>
      <button class="btn" id="prevBtn">🔍 仅预览，不删除</button>
      <button class="btn" id="cancelBtn" style="display:none">⏹ 停止</button>
      <span class="hint" id="cleanHint"></span>
    </p>
    <div id="cleanStatus"></div>
  </div>
  <div class="card" id="resultCard" style="display:none"></div>
  <div class="card" id="logCard" style="display:none"><h2>📄 逐文件记录</h2><div id="logPanel"></div></div>
  <div class="card"><h2>🧾 清理记录（保存在本机数据库中）</h2>
    <div id="histBox" class="muted">加载中…</div>
  </div>`;
  main.innerHTML=h;
  const pb=$("#policyBtn");
  if(pb)pb.addEventListener("click",async()=>{
    try{
      await api("/api/clean/enable",{method:"POST"});
      toast("已启用安全清理");
      pageClean();
    }catch(e){toast("启用失败："+e.message);}
  });
  $("#oneBtn").addEventListener("click",()=>doClean(true));
  $("#prevBtn").addEventListener("click",()=>doClean(false));
  $("#cancelBtn").addEventListener("click",async()=>{
    try{await api("/api/clean/cancel",{method:"POST"});toast("已请求停止，正在结束后续删除…");}catch(e){}
  });
  $("#selAll").addEventListener("click",()=>setSel(CLEAN_CATS.categories.map(c=>c.id)));
  $("#selNone").addEventListener("click",()=>setSel([]));
  $("#selDef").addEventListener("click",()=>setSel(CLEAN_CATS.categories.filter(c=>c.in_default).map(c=>c.id)));
  renderCatGrid(null);
  renderLastRun();
  loadHistory(0);
  resumeIfRunning();
}
function setSel(ids){
  CLEAN_SEL=new Set(ids); cleanSelSave();
  renderCatGrid(CLEAN_SCAN?CLEAN_SCAN.results:null);
  clearTimeout(setSel._t);
  setSel._t=setTimeout(()=>{if(!CLEAN_RUNNING)autoPreview();},500);
}
function renderCatGrid(results){
  const grid=$("#catGrid"); if(!grid||!CLEAN_CATS) return;
  const byId={};(results||[]).forEach(r=>byId[r.id]=r);
  grid.innerHTML=CLEAN_CATS.categories.map(c=>{
    const on=CLEAN_SEL.has(c.id), r=byId[c.id];
    let sz='<span class="none">待预估…</span>';
    if(r){
      sz=r.candidates?('<span class="sz">'+fmtSize(r.bytes)+'</span> · '+fmtInt(r.candidates)+' 项')
                     :'<span class="none">没有可清理的内容</span>';
    }
    const missing=(c.roots_exist||[]).some(x=>!x)?'<span class="tag">部分目录本机不存在</span>':'';
    const age=c.min_age_days?'<span class="tag">仅清理 '+c.min_age_days+' 天前的</span>':'';
    return '<div class="catcard '+(on?'':'off')+'" data-cat="'+esc(c.id)+'">'
      +'<label><input type="checkbox" '+(on?'checked':'')+' data-chk="'+esc(c.id)+'" style="margin-top:3px">'
      +'<span style="flex:1;min-width:0">'
      +'<div class="nm">'+esc(c.name)+missing+age+'</div>'
      +'<div class="p">'+esc(c.roots.join(" ； "))+'</div>'
      +'<div style="margin-top:5px;font-size:12px">'+sz+'</div>'
      +'<div class="im">删除影响：'+esc(c.impact||"无")+'</div>'
      +'</span></label></div>';
  }).join("");
  grid.querySelectorAll("[data-chk]").forEach(cb=>cb.addEventListener("change",()=>{
    const id=cb.dataset.chk;
    if(cb.checked)CLEAN_SEL.add(id);else CLEAN_SEL.delete(id);
    cleanSelSave();
    const card=grid.querySelector('[data-cat="'+id+'"]');
    if(card)card.classList.toggle("off",!cb.checked);
    updateSelHint();
    clearTimeout(renderCatGrid._t);
    renderCatGrid._t=setTimeout(()=>{if(!CLEAN_RUNNING)autoPreview();},600);
  }));
  updateSelHint();
}
function updateSelHint(){
  const el=$("#selHint"); if(!el) return;
  const n=CLEAN_SEL.size, all=CLEAN_CATS?CLEAN_CATS.categories.length:0;
  let s="已选 "+n+" / "+all+" 类";
  if(CLEAN_SCAN&&n){
    const rs=(CLEAN_SCAN.results||[]).filter(r=>CLEAN_SEL.has(r.id));
    const bytes=rs.reduce((a,r)=>a+(r.bytes||0),0);
    const cnt=rs.reduce((a,r)=>a+(r.candidates||0),0);
    s+=" · 预计可释放 "+fmtSize(bytes)+"（"+fmtInt(cnt)+" 项候选）";
  }
  el.textContent=s;
}
async function autoPreview(){
  if(!$("#catGrid")||CLEAN_RUNNING) return;
  if(!CLEAN_SEL.size){CLEAN_SCAN=null;renderCatGrid(null);return;}
  const box=$("#cleanStatus");
  if(box)box.innerHTML='<p class="muted">正在估算可释放空间…（只读预览，不会删除任何文件）</p>';
  try{
    const j=await api("/api/clean/scan",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({categories:[...CLEAN_SEL]})});
    CLEAN_SCAN=j; renderCatGrid(j.results);
    if(box)box.innerHTML="";
    showPreview(j);
  }catch(e){
    if(box)box.innerHTML='<p class="muted">预估失败：'+esc(e.message)+'（不影响清理功能）</p>';
  }
}
async function resumeIfRunning(){
  try{
    const j=await api("/api/clean/status");
    const ph=j.phase||"";
    if(ph==="running"||ph==="cancelling"||ph.indexOf("running:")===0){
      CLEAN_RUNNING=true; $("#cancelBtn").style.display=""; pollStatus();
      return;
    }
  }catch(e){}
  // 空闲：自动做一次只读预估，让用户先看到"能释放多少"
  autoPreview();
}
async function doClean(run){
  const ids=[...CLEAN_SEL];
  if(!ids.length){toast("请至少勾选一个清理类别");return;}
  const btn=$("#oneBtn"),pv=$("#prevBtn"),hint=$("#cleanHint");
  btn.disabled=pv.disabled=true;
  CLEAN_RUNNING=true;
  hint.textContent=run?"正在清理（可随时点「停止」）…":"正在预览扫描…";
  try{
    const j=await api("/api/clean/"+(run?"run":"scan"),{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({categories:ids})});
    if(run){
      $("#cancelBtn").style.display="";
      $("#cleanStatus").innerHTML='<div class="pbar"><i style="width:0%"></i></div>';
      pollStatus();
    }else{
      CLEAN_RUNNING=false; CLEAN_SCAN=j; renderCatGrid(j.results); showPreview(j);
      hint.textContent=""; btn.disabled=pv.disabled=false;
    }
  }catch(e){
    CLEAN_RUNNING=false; hint.textContent=""; toast("操作失败："+e.message);
    btn.disabled=pv.disabled=false;
  }
}
async function pollStatus(){
  clearTimeout(cleanTimer);
  if(curPage!=="clean"||!$("#cleanStatus")){CLEAN_RUNNING=false;return;}
  let j;
  try{ j=await api("/api/clean/status"); }
  catch(e){
    $("#cleanHint").textContent="状态查询失败，正在重试…（"+e.message+"）";
    cleanTimer=setTimeout(pollStatus,1500); return;
  }
  const ph=j.phase||"";
  const running=ph==="running"||ph==="cancelling"||ph.indexOf("running:")===0;
  if(running){
    CLEAN_RUNNING=true;
    const p=j.progress||{}, t=j.totals||{};
    $("#cleanStatus").innerHTML='<div class="pbar"><i style="width:'+(p.pct||0)+'%"></i></div>'
      +'<div class="kpi"><span><b>'+esc(p.current||"准备中…")+'</b></span>'
      +'<span>进度 '+(p.pct||0)+'%</span>'
      +'<span>已处理 '+fmtInt(p.processed||0)+(p.total?" / "+fmtInt(p.total):"")+' 项</span>'
      +'<span>已释放 <b>'+fmtSize(t.freed_bytes||0)+'</b></span>'
      +'<span>跳过 '+fmtInt(t.skipped||0)+'</span>'
      +'<span>失败 '+fmtInt(t.failed||0)+'</span>'
      +'<span>已用时 '+fmtDur(p.elapsed||0)+'</span>'
      +(p.eta_s!=null?'<span>预计剩余 '+fmtDur(p.eta_s)+'</span>':'')+'</div>';
    $("#cancelBtn").style.display="";
    $("#oneBtn").disabled=true; $("#prevBtn").disabled=true;
    cleanTimer=setTimeout(pollStatus,400);
    return;
  }
  CLEAN_RUNNING=false;
  $("#cancelBtn").style.display="none";
  $("#oneBtn").disabled=false; $("#prevBtn").disabled=false;
  $("#cleanHint").textContent="";
  if(ph==="done"||ph==="cancelled"){
    $("#cleanStatus").innerHTML="";
    toast(ph==="cancelled"?"已停止：后续删除已取消":"✅ 清理完成");
    const rc=$("#resultCard"); if(rc){rc.style.display="none";rc.innerHTML="";}
    await renderLastRun();
    loadHistory(0);
    autoPreview();          // 重新估算，让分类卡片显示清理后的剩余量
  }else if(ph==="error"){
    $("#cleanStatus").innerHTML='<div class="banner err">清理出错：'+esc(j.error||"未知错误")
      +'（已删除的部分仍记录在日志里）</div>';
    await renderLastRun();
  }else{
    $("#cleanStatus").innerHTML="";
  }
}

/* ---------- 上次清理结果（持久化，刷新页面也在） ---------- */
async function renderLastRun(){
  const box=$("#cleanBanner"); if(!box) return;
  let j;
  try{ j=await api("/api/clean/last"); }
  catch(e){
    box.innerHTML='<div class="banner err">读取上次清理记录失败：'+esc(e.message)+'</div>';
    return;
  }
  const r=j.run;
  if(!r){
    box.innerHTML='<div class="notice">还没有清理记录。第一次点击「🧹 一键清理所选类别」后，'
      +'这里会一直显示上次的清理结果（刷新页面也不会丢）。</div>';
    return;
  }
  box.innerHTML=runBannerHtml(r)+runResultHtml(r);
  box.querySelectorAll("[data-log]").forEach(b=>b.addEventListener("click",()=>{
    const card=$("#logCard");
    if(card){card.style.display="";card.scrollIntoView({behavior:"smooth",block:"start"});}
    openLogPanel(r.id,"",0);
  }));
  box.querySelectorAll("[data-again]").forEach(b=>b.addEventListener("click",()=>doClean(true)));
}
function runBannerHtml(r){
  const d=r.detail||{}, st=(CLEAN_ST[r.status]||[r.status||"未知","b-gray"]);
  const cls=r.status==="done"?"ok":(r.status==="error"||r.status==="interrupted")?"err":"warn";
  const title={done:"✅ 清理完成",cancelled:"⏹ 清理已停止",error:"⚠️ 清理出错",
               interrupted:"⚠️ 上次清理被中断"}[r.status]||("状态："+esc(r.status||"未知"));
  const freed=r.freed_bytes||0;
  let h='<div class="banner '+cls+'">'
    +'<h2>'+title+'<span class="tag">记录 #'+r.id+'</span><span class="tag">'+esc(st[0])+'</span></h2>';
  if(r.status==="error"&&r.error) h+='<div>'+esc(r.error)+'</div>';
  if(freed>0){
    h+='<div class="big">本次释放 '+fmtSize(freed)+'</div>';
  }else if(r.status==="done"){
    h+='<div class="big" style="font-size:17px">本次没有删除文件'
      +((r.candidates||0)>0?'（候选对象都被安全跳过，原因见下方）':'（本来就没有可清理的内容）')+'</div>';
  }
  h+='<div class="row2"><span>清理文件 <b>'+fmtInt(r.deleted||0)+'</b> 个</span>'
    +'<span>跳过 '+fmtInt(r.skipped||0)+'</span>'
    +'<span>失败 '+fmtInt(r.failed||0)+'</span>'
    +'<span>用时 '+fmtDur(r.duration_s)+'</span>'
    +'<span>'+(r.finished?"结束于 ":"开始于 ")+esc(r.finished||r.started||"—")+'</span></div>';
  if(r.free_before!=null&&r.free_after!=null){
    const delta=r.free_after-r.free_before;
    h+='<div class="row2"><span>相关磁盘可用空间 '+fmtSize(r.free_before)+' → '
      +fmtSize(r.free_after)+'（<b>'+fmtDelta(delta)+'</b>）</span></div>';
  }
  h+=reasonsHtml(d);
  if(d.notes&&d.notes.length){
    h+='<details style="margin-top:6px"><summary>扫描说明（'+d.notes.length+' 条）</summary><ul>'
      +d.notes.map(n=>'<li class="muted">'+esc(n)+'</li>').join("")+'</ul></details>';
  }
  h+='<div class="acts"><button class="btn mini" data-log="1">📄 查看逐文件记录</button>'
    +'<button class="btn mini" data-again="1">🔁 再清理一次</button>'
    +'<a class="btn mini" href="/api/clean/log.csv?run_id='+r.id+'">⬇ 导出 CSV</a></div>';
  h+='</div>';
  return h;
}
function reasonsHtml(d){
  const rs=(d&&d.reasons)||{}, txt=(d&&d.reason_text)||{};
  const keys=Object.keys(rs).sort((a,b)=>rs[b]-rs[a]);
  if(!keys.length) return "";
  return '<div class="warnbox" style="margin-top:10px"><b>跳过 / 失败原因（多数不是故障）：</b><div style="margin-top:4px">'
    +keys.map(k=>esc(txt[k]||k)+'：<b>'+fmtInt(rs[k])+'</b> 项').join("　·　")+'</div></div>';
}
function runResultHtml(r){
  const d=r.detail||{}, rows=d.results||[];
  if(!rows.length) return "";
  let h='<div class="card" style="margin-top:12px"><h2>各类别明细</h2>'
    +'<table><tr><th>类别</th><th>候选</th><th>已清理</th><th>跳过</th><th>失败</th><th>释放空间</th></tr>'
    +rows.map(x=>'<tr><td>'+esc(x.name||x.id)+'</td><td>'+fmtInt(x.candidates||0)+'</td>'
      +'<td><b>'+fmtInt(x.deleted||0)+'</b></td><td>'+fmtInt(x.skipped||0)+'</td>'
      +'<td>'+fmtInt(x.failed||0)+'</td><td><b>'+fmtSize(x.freed_bytes||0)+'</b></td></tr>').join("")
    +'</table></div>';
  return h;
}

/* ---------- 预览结果（只读，不写入历史） ---------- */
function showPreview(j){
  const card=$("#resultCard"); if(!card) return;
  card.style.display="";
  const t=j.totals||{}, rows=j.results||[];
  let h='<h2>🔍 预览结果<span class="tag">未删除任何文件</span></h2>';
  if(!(t.candidates||0)){
    h+='<div class="notice">✅ <b>没有发现符合安全规则的垃圾文件</b>——本工具不会为了显示效果强行删除东西。</div>';
    card.innerHTML=h; return;
  }
  h+='<div class="kpi"><span>候选 <b>'+fmtInt(t.candidates)+'</b> 项</span>'
    +'<span>展开为 <b>'+fmtInt(t.items||t.candidates)+'</b> 个文件/目录</span>'
    +'<span>预计可释放 <b>'+fmtSize(t.bytes||0)+'</b></span>'
    +'<span>预估于 '+esc(j.at||"")+'</span></div>';
  h+='<table><tr><th>类别</th><th>候选</th><th>预计释放</th><th>最早可清理</th></tr>'
    +rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+fmtInt(r.candidates||0)+'</td>'
      +'<td>'+fmtSize(r.bytes||0)+'</td><td class="muted">'
      +(r.min_age_days?r.min_age_days+' 天前的':'不限')+'</td></tr>').join("")
    +'<tr><th>合计</th><th>'+fmtInt(t.candidates||0)+'</th><th>'+fmtSize(t.bytes||0)+'</th><th></th></tr></table>';
  if(j.notes&&j.notes.length){
    h+='<details style="margin-top:8px"><summary>扫描说明（'+j.notes.length+' 条）</summary><ul>'
      +j.notes.map(n=>'<li class="muted">'+esc(n)+'</li>').join("")+'</ul></details>';
  }
  h+='<p class="muted" style="margin-top:10px">确认无误后，点上面的「🧹 一键清理所选类别」执行；'
    +'执行时被占用/无权限的对象仍会被跳过。</p>';
  card.innerHTML=h;
}

/* ---------- 清理记录（分页） ---------- */
async function loadHistory(offset){
  const box=$("#histBox"); if(!box) return;
  CLEAN_HIST.offset=Math.max(0,offset||0);
  box.innerHTML='<p class="muted">加载中…</p>';
  let j;
  try{
    j=await api("/api/clean/history?offset="+CLEAN_HIST.offset+"&limit="+CLEAN_HIST.limit);
  }catch(e){
    box.innerHTML='<div class="warnbox">清理记录读取失败：'+esc(e.message)
      +'<br><span class="muted">可点上面的「重试」或刷新页面；若持续失败请把这段提示发给开发者。</span>'
      +' <button class="btn mini" id="histRetry">重试</button></div>';
    const rb=$("#histRetry"); if(rb)rb.addEventListener("click",()=>loadHistory(CLEAN_HIST.offset));
    return;
  }
  CLEAN_HIST.total=j.total||0;
  if(!j.items.length){
    box.innerHTML='<p class="muted">'+(CLEAN_HIST.total?
      '这一页没有记录。':'还没有清理记录。第一次清理后，这里会显示每次的时间、数量、释放空间与逐文件日志。')+'</p>';
    return;
  }
  box.innerHTML='<table><tr><th>时间</th><th>状态</th><th>已清理</th><th>跳过</th><th>失败</th>'
    +'<th>释放空间</th><th>用时</th><th>操作</th></tr>'
    +j.items.map(r=>{
      const st=CLEAN_ST[r.status]||[r.status||"未知","b-gray"];
      return '<tr><td>'+esc(r.started||"—")+'</td>'
        +'<td><span class="badge '+st[1]+'">'+esc(st[0])+'</span></td>'
        +'<td><b>'+fmtInt(r.deleted||0)+'</b></td><td>'+fmtInt(r.skipped||0)+'</td>'
        +'<td>'+fmtInt(r.failed||0)+'</td><td>'+fmtSize(r.freed_bytes||0)+'</td>'
        +'<td>'+fmtDur(r.duration_s)+'</td>'
        +'<td><button class="btn mini" data-run="'+r.id+'">逐文件</button> '
        +'<a class="btn mini" href="/api/clean/log.csv?run_id='+r.id+'">CSV</a></td></tr>';
    }).join("")+'</table>'
    +'<div class="pager"><button class="btn mini" id="histPrev" '
      +(CLEAN_HIST.offset<=0?'disabled':'')+'>← 上一页</button>'
      +'<span class="hint">第 '+(CLEAN_HIST.offset+1)+'–'
      +Math.min(CLEAN_HIST.offset+CLEAN_HIST.limit,CLEAN_HIST.total)+' 条 / 共 '
      +fmtInt(CLEAN_HIST.total)+' 条</span>'
      +'<button class="btn mini" id="histNext" '
      +(CLEAN_HIST.offset+CLEAN_HIST.limit>=CLEAN_HIST.total?'disabled':'')+'>下一页 →</button></div>';
  const p=$("#histPrev"),n=$("#histNext");
  if(p)p.addEventListener("click",()=>loadHistory(Math.max(0,CLEAN_HIST.offset-CLEAN_HIST.limit)));
  if(n)n.addEventListener("click",()=>loadHistory(CLEAN_HIST.offset+CLEAN_HIST.limit));
  box.querySelectorAll("[data-run]").forEach(b=>b.addEventListener("click",()=>{
    const card=$("#logCard");
    if(card){card.style.display="";card.scrollIntoView({behavior:"smooth",block:"start"});}
    openLogPanel(parseInt(b.dataset.run,10),"",0);
  }));
}

/* ---------- 逐文件记录（分页 + 筛选 + 导出） ---------- */
const LOG_ST={deleted:["已删除","b-green"],skipped:["跳过","b-gray"],failed:["失败","b-red"],
              dir_done:["目录已清空","b-blue"],dir_partial:["目录部分清理","b-yellow"]};
async function openLogPanel(runId,status,offset){
  CLEAN_LOG={run:runId,status:status||"",offset:Math.max(0,offset||0)};
  const box=$("#logPanel"); if(!box) return;
  box.innerHTML='<p class="muted">加载中…</p>';
  const qs="run_id="+runId+"&status="+encodeURIComponent(CLEAN_LOG.status)
    +"&offset="+CLEAN_LOG.offset+"&limit=100";
  let j;
  try{ j=await api("/api/clean/log?"+qs); }
  catch(e){ box.innerHTML='<div class="warnbox">逐文件记录读取失败：'+esc(e.message)+'</div>'; return; }
  const tabs=[["","全部"],["deleted","已删除"],["skipped","跳过"],["failed","失败"]];
  let h='<div class="pager" style="margin:0 0 8px">'
    +tabs.map(t=>'<button class="btn mini '+(CLEAN_LOG.status===t[0]?'primary':'')
      +'" data-st="'+t[0]+'">'+t[1]+'</button>').join("")
    +'<span class="hint" style="margin-left:auto">运行 #'+runId+' · 共 '+fmtInt(j.total)+' 条</span>'
    +'<a class="btn mini" href="/api/clean/log.csv?run_id='+runId
    +(CLEAN_LOG.status?'&status='+CLEAN_LOG.status:'')+'">⬇ 导出这批 CSV</a></div>';
  if(!j.items.length){
    h+='<p class="muted">没有符合条件的记录。</p>';
  }else{
    h+='<table><tr><th>结果</th><th>规则</th><th>路径</th><th>大小</th><th>说明</th></tr>'
      +j.items.map(x=>{
        const st=LOG_ST[x.status]||[x.status,"b-gray"];
        return '<tr><td><span class="badge '+st[1]+'">'+esc(st[0])+'</span></td>'
          +'<td class="muted">'+esc(x.rule_id||"")+'</td>'
          +'<td class="mono">'+esc(x.path||"")+'</td>'
          +'<td>'+(x.size!=null?fmtSize(x.size):"—")+'</td>'
          +'<td class="muted">'+esc(x.reason||"")+'</td></tr>';
      }).join("")+'</table>'
      +'<div class="pager"><button class="btn mini" id="logPrev" '
        +(CLEAN_LOG.offset<=0?'disabled':'')+'>← 上一页</button>'
        +'<span class="hint">第 '+(CLEAN_LOG.offset+1)+'–'
        +Math.min(CLEAN_LOG.offset+100,j.total)+' 条 / 共 '+fmtInt(j.total)+' 条</span>'
        +'<button class="btn mini" id="logNext" '
        +(CLEAN_LOG.offset+100>=j.total?'disabled':'')+'>下一页 →</button></div>';
  }
  box.innerHTML=h;
  box.querySelectorAll("[data-st]").forEach(b=>b.addEventListener("click",()=>{
    openLogPanel(runId,b.dataset.st,0);
  }));
  const p=$("#logPrev"),n=$("#logNext");
  if(p)p.addEventListener("click",()=>openLogPanel(runId,CLEAN_LOG.status,CLEAN_LOG.offset-100));
  if(n)n.addEventListener("click",()=>openLogPanel(runId,CLEAN_LOG.status,CLEAN_LOG.offset+100));
}

/* ==================== 启动 ==================== */
async function boot(){
  $("#foot").innerHTML="本机文件地图与一键清理助手 · 只读盘点 + 白名单安全清理 · 数据保存在本工具目录（fmdata.db）"+
    " · 全量盘点用 重新扫描.bat，日常更新用 python fm_scan.py --incremental";
  try{
    SUMMARY = await api("/api/summary");
  }catch(e){
    main.innerHTML='<div class="card"><h2>需要先启动本地服务</h2>'+
      '<p>未连接到扫描数据库（'+esc(e.message)+'）。请：</p>'+
      '<p>1. 双击本目录的 <b>启动文件地图.bat</b>（会启动本地服务并自动打开本页）；</p>'+
      '<p>2. 若还没扫描过，先双击 <b>重新扫描.bat</b> 生成 fmdata.db。</p>'+
      '<p class="muted">v2 版数据量为全量盘点（可达数百万条），必须通过本地服务分页读取，不再支持直接双击 index.html 静态浏览。</p></div>';
    $("#metaLine").textContent="未连接数据库";
    return;
  }
  const st=SUMMARY.stats||{};
  $("#metaLine").textContent="扫描时间："+(SUMMARY.scanned_at||"—")+" · 耗时 "+Math.round(SUMMARY.duration_s||0)+
    " 秒 · 用户："+esc(SUMMARY.user||"")+" · 记录 "+fmtInt(st.rows)+" 条（目录 "+fmtInt(st.dirs)+" / 文件 "+fmtInt(st.files)+"）";
  initTabs();
  render();
}
boot();
</script>
